<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AnimoReader</title>
<meta name="theme-color" content="#1F7A8C">
<meta name="description" content="Armá tu estado mental en una oración y tratá de imaginar el del otro.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="AnimoReader">
<style>
:root{--bg:#EEF3F5;--card:#fff;--ink:#16252E;--mute:#5A6C77;--line:#CBD7DD;--me:#1F7A8C;--gu:#B9741A;--on:#fff;--chip:#E3ECF0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1A20;--card:#17262E;--ink:#E6EFF3;--mute:#93A7B2;--line:#2B3F4A;--me:#4FB3C6;--gu:#E3A04F;--on:#0F1A20;--chip:#223641}}
:root[data-theme="dark"]{--bg:#0F1A20;--card:#17262E;--ink:#E6EFF3;--mute:#93A7B2;--line:#2B3F4A;--me:#4FB3C6;--gu:#E3A04F;--on:#0F1A20;--chip:#223641}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Bricolage Grotesque",system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:16px 16px 40px}
h1{font:500 1.1rem "Bricolage Grotesque",sans-serif;margin:4px 0 12px;color:var(--mute)}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tabs button{flex:1;padding:10px 6px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;font:inherit;cursor:pointer}
.tabs button[aria-selected=true]{background:var(--accent,var(--me));color:var(--on);border-color:transparent;font-weight:600}
.say{position:sticky;top:env(safe-area-inset-top,0px);z-index:2;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--accent,var(--me));border-radius:12px;padding:14px 16px;margin-bottom:14px}
.say p{margin:0;font:400 1.35rem/1.35 Newsreader,Georgia,serif}
.say .empty{color:var(--mute);font-style:italic}
.row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.row button,.q button{padding:8px 12px;border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:8px;font:inherit;cursor:pointer}
fieldset{border:0;padding:0;margin:0 0 14px}
legend{font-weight:600;margin-bottom:6px;padding:0}
legend small{color:var(--mute);font-weight:400}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:8px 12px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;font:inherit;cursor:pointer}
.chip[aria-pressed=true]{background:var(--accent,var(--me));color:var(--on);border-color:transparent}
button:focus-visible{outline:3px solid var(--accent,var(--me));outline-offset:2px}
.q{background:var(--chip);border-radius:12px;padding:12px 14px;margin:6px 0 14px}
.q p{margin:4px 0}
.n{color:var(--mute);font-size:.9rem;text-align:center;margin-top:18px}
.cmp{width:100%;border-collapse:collapse;background:var(--card);border-radius:12px;overflow:hidden}
.cmp th,.cmp td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;font-size:.95rem}
.cmp th{color:var(--mute);font-weight:600}
.ok{color:var(--me);font-weight:600}.no{color:var(--gu);font-weight:600}
.wrap{overflow-x:auto}
.say p+p{margin-top:8px}
.say p.hint{margin-top:8px;color:var(--mute);font:400 .95rem/1.35 "Bricolage Grotesque",system-ui,sans-serif;font-style:normal}
.gate{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--gu);border-radius:12px;padding:16px 16px 14px}
.gate h2{font:500 1.35rem/1.3 Newsreader,Georgia,serif;margin:0 0 8px}
.gate p{margin:0 0 12px}
.gate button,.q button{padding:8px 12px;border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:8px;font:inherit;cursor:pointer}
.row button.share{background:var(--me);color:var(--on);border-color:transparent;font-weight:600}
.row button.wa{display:inline-flex;align-items:center;gap:6px;background:#25D366;color:#fff;border-color:transparent;font-weight:600}
.row button.wa svg{width:18px;height:18px;display:block;flex:none}
.row button.go,.gate button.go,.q button.go{background:var(--gu);color:var(--on);border-color:transparent;font-weight:600}
.chip:disabled{opacity:.72;cursor:default}
.url{display:block;width:100%;margin-top:8px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font:inherit;color:var(--ink);background:var(--bg)}
main.has-dock{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:4;background:var(--card);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.dock-inner{max-width:640px;margin:0 auto;display:flex;gap:12px;align-items:center;justify-content:space-between}
.dock p{margin:0}
.dock button{padding:10px 16px;border:0;border-radius:10px;font:inherit;font-weight:600;background:var(--gu);color:var(--on);cursor:pointer}
.install{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 14px}
.install[hidden]{display:none}
.install p{margin:0;flex:1 1 180px;font-size:.95rem}
.install .row{margin-top:0;flex:none}
.install button.install-go{background:var(--me);color:var(--on);border-color:transparent;font-weight:600}
.install button.install-x{background:transparent;border-color:transparent;color:var(--mute)}
</style>
</head>
<body>
<main>
<h1>AnimoReader: cómo estoy, cómo imagino que estás</h1>
<div id="install" class="install" hidden></div>
<div class="tabs" role="tablist">
<button role="tab" id="t-me" aria-selected="true">Mi estado</button>
<button role="tab" id="t-gu" aria-selected="false">Imagino tu estado</button>
<button role="tab" id="t-cm" aria-selected="false">Comparar</button>
</div>
<div id="app"></div>
<p class="n" id="count"></p>
</main>
<script>
var D=[
{k:'modo',t:'Modo',o:[['resolver','en modo resolver'],['tiempo','en modo tiempo para algo'],['descanso','en modo descanso'],['escuchar','en modo escuchar'],['conectar','en modo conectar'],['crear','en modo crear'],['trabajar','en modo trabajar'],['jugar','en modo jugar'],['cuidar','en modo cuidar'],['planear','en modo planear'],['procesar','en modo procesar'],['silencio','en modo silencio'],['compania','en modo compañía']]},
{k:'foco',t:'Foco',o:[['problema','con el foco en un problema'],['relacion','con el foco en la relación (quiero conectar)'],['necesidad','con el foco en una necesidad (tengo ganas de algo)'],['pasatiempo','con el foco en un pasatiempo'],['aprender','con el foco en aprender algo'],['trabajo','con el foco en el trabajo'],['casa','con el foco en la casa'],['salud','con el foco en la salud'],['dinero','con el foco en el dinero'],['futuro','con el foco en el futuro'],['conversacion','con el foco en una conversación'],['cuerpo','con el foco en el cuerpo'],['proyecto','con el foco en un proyecto'],['naturaleza','con el foco en la naturaleza'],['memoria','con el foco en un recuerdo'],['entender','con el foco en entender qué pasa']]},
{k:'emo',t:'Emoción',multi:1,o:[['frus','frustración e impotencia'],['enojo','enojo o bronca'],['ans','ansiedad'],['amor','amor'],['ale','alegría o diversión'],['apa','apatía'],['des','desilusión'],['miedo','miedo'],['tristeza','tristeza'],['calma','calma'],['verguenza','vergüenza'],['culpa','culpa'],['esperanza','esperanza'],['gratitud','gratitud'],['soledad','soledad'],['ternura','ternura'],['confusion','confusión'],['incomp','incomprendido'],['voluntad','buena voluntad'],['incertidumbre','incertidumbre']]},
{k:'tiempo',t:'Percepción del tiempo',o:[['t','con tiempo disponible'],['a','con algo de tiempo'],['p','con poco tiempo'],['n','sin tiempo'],['apuro','con apuro'],['lento','con el tiempo yendo lento'],['rapido','con el tiempo yendo rápido'],['espera','esperando'],['pausa','con una pausa']]},
{k:'nec',t:'Necesidad del cuerpo',multi:1,o:[['ham','con hambre'],['ban','con ganas de ir al baño'],['sex','con deseo de intimidad'],['des','con sueño'],['sed','con sed'],['frio','con frío'],['calor','con calor'],['dolor','con dolor o molestia'],['cansancio','con cansancio'],['aire','con ganas de aire libre'],['movimiento','con ganas de moverme'],['contacto','con ganas de contacto'],['higiene','con ganas de asearme'],['energia','con poca energía'],['abrazo','con ganas de un abrazo'],['ejercicio','con ganas de hacer ejercicios'],['mindfulness','con ganas de hacer mindfulness'],['regulacion','con ganas de regulación emocional']]},
{k:'animo',t:'Estado de ánimo',o:[['b','de buen humor'],['m','de mal humor'],['neutro','de ánimo neutro'],['irritable','de ánimo irritable'],['sensible','de ánimo sensible'],['animado','de ánimo animado'],['apagado','de ánimo apagado']]}
];
/* Enlace: #e=<versión>.<modo>-<foco>-<emociones>-<tiempo>-<necesidad>-<ánimo>
   Elección única: 0 = sin elegir, 1..n = opción en el orden de esa versión.
   Emociones y necesidad: máscara de bits, en el mismo orden.
   Si cambia el orden o el sentido de una opción, subí SCHEMA y conservá la lista anterior. */
var SCHEMA=2;
var VERSIONS={1:[
{k:'modo',keys:['resolver','tiempo','descanso','escuchar','conectar','crear','trabajar','jugar','cuidar','planear','procesar','silencio','compania']},
{k:'foco',keys:['problema','relacion','necesidad','pasatiempo','aprender','trabajo','casa','salud','dinero','futuro','conversacion','cuerpo','proyecto','naturaleza','memoria','entender']},
{k:'emo',multi:1,keys:['frus','enojo','ans','amor','ale','apa','des','miedo','tristeza','calma','verguenza','culpa','esperanza','gratitud','soledad','ternura','confusion','incomp','voluntad']},
{k:'tiempo',keys:['t','a','p','n','apuro','lento','rapido','espera','pausa']},
{k:'nec',keys:['ham','ban','sex','des','sed','frio','calor','dolor','cansancio','aire','movimiento','contacto','higiene','energia']},
{k:'animo',keys:['b','m','neutro','irritable','sensible','animado','apagado']}
],2:[
{k:'modo',keys:['resolver','tiempo','descanso','escuchar','conectar','crear','trabajar','jugar','cuidar','planear','procesar','silencio','compania']},
{k:'foco',keys:['problema','relacion','necesidad','pasatiempo','aprender','trabajo','casa','salud','dinero','futuro','conversacion','cuerpo','proyecto','naturaleza','memoria','entender']},
{k:'emo',multi:1,keys:['frus','enojo','ans','amor','ale','apa','des','miedo','tristeza','calma','verguenza','culpa','esperanza','gratitud','soledad','ternura','confusion','incomp','voluntad','incertidumbre']},
{k:'tiempo',keys:['t','a','p','n','apuro','lento','rapido','espera','pausa']},
{k:'nec',multi:1,keys:['ham','ban','sex','des','sed','frio','calor','dolor','cansancio','aire','movimiento','contacto','higiene','energia','abrazo','ejercicio','mindfulness','regulacion']},
{k:'animo',keys:['b','m','neutro','irritable','sensible','animado','apagado']}
]};
var SSKEY='animoreader-share';
var LSKEY='animoreader-state';
var S={me:{},gu:{}},tab='me',incoming=null,showGate=false,shownLink='';
var $=function(i){return document.getElementById(i)};
function lab(d,v){for(var i=0;i<d.o.length;i++)if(d.o[i][0]===v)return d.o[i][1]}
function selectedKeys(d,st){var v=st[d.k];if(v==null||v==='')return [];if(!d.multi)return [v];
 var list=Array.isArray(v)?v:[v];if(!list.length)return [];
 return d.o.map(function(o){return o[0]}).filter(function(k){return list.indexOf(k)>-1})}
function joinLabs(labels){return labels.length>1?labels.slice(0,-1).join(', ')+' y '+labels[labels.length-1]:labels[0]}
function parts(st){var r=[];D.forEach(function(d){var keys=selectedKeys(d,st);if(!keys.length)return;
 var labels=keys.map(function(x){return lab(d,x)});
 if(d.k==='emo')r.push('sintiendo '+joinLabs(labels));
 else r.push(joinLabs(labels))});return r}
function sentence(st,who){var p=parts(st);if(!p.length)return '';
 var j=p.length>1?p.slice(0,-1).join(', ')+' y '+p[p.length-1]:p[0];
 var lead=who==='me'?'Estoy ':who==='them'?'Está ':'Creo que estás ';
 return lead+j+'.'}
function hasNec(st,key){var v=st.nec;if(!v)return false;if(Array.isArray(v))return v.indexOf(key)>-1;return v===key}
function questions(st){var q=[];
 if(st.modo==='resolver'||st.foco==='problema')q.push('¿Quieres que te ayude a resolverlo o prefieres que solo te escuche?');
 if(st.modo==='descanso')q.push('¿Necesitas espacio o compañía tranquila?');
 if(st.foco==='relacion')q.push('¿Te parece si dedicamos un rato a estar juntos?');
 if(st.tiempo==='p'||st.tiempo==='n')q.push('¿Lo retomamos más tarde, a una hora que acordemos?');
 if(st.nec&&(hasNec(st,'ham')||hasNec(st,'des')||hasNec(st,'ban')))q.push('¿Atendemos primero esta necesidad y después conversamos?');
 if(st.emo&&st.emo.length>1)q.push('Estoy sintiendo varias cosas a la vez. ¿Me das un momento para ordenarlas?');
 return q.slice(0,2)}
function hasAny(st){return D.some(function(d){var v=st[d.k];return d.multi?!!(v&&v.length):!!v})}
function cloneState(st){var o={};D.forEach(function(d){var v=st&&st[d.k];if(v==null||v==='')return;
 if(d.multi){var list=Array.isArray(v)?v:[v];list=list.filter(function(k){return d.o.some(function(x){return x[0]===k})});if(list.length)o[d.k]=list}
 else if(d.o.some(function(x){return x[0]===v}))o[d.k]=v});return o}
function lockedGuess(){return tab==='gu'&&incoming&&incoming.revealed}
function pick(d,v){if(lockedGuess())return;var st=S[tab];
 if(d.multi){var raw=st[d.k],a=Array.isArray(raw)?raw:(raw?[raw]:[]),i=a.indexOf(v);if(i>-1)a.splice(i,1);else a.push(v);st[d.k]=a}
 else st[d.k]=st[d.k]===v?null:v;
 if(tab==='me')shownLink='';
 if(tab==='gu'&&incoming&&incoming.state&&!incoming.revealed){incoming.guess=cloneState(S.gu);incoming.started=true;saveIncoming()}
 saveLocal();
 render()}
function total(){var n=1;D.forEach(function(d){n*=d.multi?Math.pow(2,d.o.length):d.o.length+1});return n}
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e}
function specOk(){var spec=VERSIONS[SCHEMA];if(!spec||spec.length!==D.length)return false;
 for(var i=0;i<D.length;i++){if(D[i].k!==spec[i].k||!!D[i].multi!==!!spec[i].multi||D[i].o.length!==spec[i].keys.length)return false;
  for(var j=0;j<D[i].o.length;j++)if(D[i].o[j][0]!==spec[i].keys[j])return false}return true}
function encodeState(st){var spec=VERSIONS[SCHEMA];
 return SCHEMA+'.'+spec.map(function(d){var v=st[d.k];
  if(d.multi){var list=Array.isArray(v)?v:(v?[v]:[]);var bits=0;list.forEach(function(key){var i=d.keys.indexOf(key);if(i>-1)bits+=Math.pow(2,i)});return bits}
  if(!v)return 0;var i=d.keys.indexOf(v);return i<0?0:i+1}).join('-')}
function fail(msg){return {ok:false,error:msg}}
function decode(payload){
 if(!payload||payload.length>80)return fail('Este enlace no se pudo leer.');
 var dot=payload.indexOf('.');if(dot<1)return fail('Este enlace no se pudo leer.');
 var verText=payload.slice(0,dot),rest=payload.slice(dot+1);
 if(!/^\d+$/.test(verText))return fail('Este enlace no se pudo leer.');
 var ver=+verText,spec=VERSIONS[ver];
 if(!spec)return ver>SCHEMA?fail('Este enlace es de una versión más nueva de la app. Cuando la actualices, pídele que lo comparta de nuevo.'):fail('Este enlace no se pudo leer.');
 var parts=rest.split('-');if(parts.length!==spec.length)return fail('Este enlace no se pudo leer.');
 var st={};
 for(var i=0;i<spec.length;i++){if(!/^\d+$/.test(parts[i]))return fail('Este enlace no se pudo leer.');
  var n=+parts[i],d=spec[i],cur=null;D.forEach(function(x){if(x.k===d.k)cur=x});if(!cur)continue;
  if(d.multi){if(n>=Math.pow(2,d.keys.length))return fail('Este enlace no se pudo leer.');
   var arr=[];d.keys.forEach(function(key,bit){if((n&Math.pow(2,bit))&&cur.o.some(function(o){return o[0]===key}))arr.push(key)});if(arr.length)st[d.k]=arr}
  else{if(n===0)continue;if(n>d.keys.length)return fail('Este enlace no se pudo leer.');
   var key=d.keys[n-1];if(cur.o.some(function(o){return o[0]===key}))st[d.k]=key}}
 return {ok:true,state:st}}
function shareUrl(st){return location.href.split('#')[0]+'#e='+encodeState(st)}
function loadLocal(){try{var s=JSON.parse(localStorage.getItem(LSKEY)||'null');if(!s)return;if(s.me)S.me=cloneState(s.me);if(s.gu)S.gu=cloneState(s.gu)}catch(e){}}
function saveLocal(){try{localStorage.setItem(LSKEY,JSON.stringify({me:cloneState(S.me),gu:cloneState(S.gu)}))}catch(e){}}
function loadSaved(raw){try{var s=JSON.parse(sessionStorage.getItem(SSKEY)||'null');if(!s||s.raw!==raw)return null;return s}catch(e){return null}}
function saveIncoming(){if(!incoming||!incoming.raw||incoming.error)return;
 try{sessionStorage.setItem(SSKEY,JSON.stringify({raw:incoming.raw,revealed:!!incoming.revealed,guess:incoming.guess,started:!!incoming.started}))}catch(e){}}
function readLink(){
 var h='';try{h=decodeURIComponent((location.hash||'').replace(/^#/,'')).trim()}catch(e){h=''}
 if(!h){incoming=null;showGate=false;return}
 var m=/^e=([0-9.\-]+)$/.exec(h);if(!m){if(h.indexOf('e=')===0){incoming={error:'Este enlace no se pudo leer.'};showGate=false}return}
 var raw=m[1];if(incoming&&incoming.raw===raw&&(incoming.state||incoming.error))return;
 var dec=decode(raw);
 if(!dec.ok){incoming={raw:raw,error:dec.error};showGate=false;return}
 if(!hasAny(dec.state)){incoming={raw:raw,error:'Este enlace no trae ningún estado.'};showGate=false;return}
 var saved=loadSaved(raw);
 if(saved&&saved.revealed)S.gu=cloneState(saved.guess||{});
 else if(saved&&hasAny(saved.guess||{}))S.gu=cloneState(saved.guess);
 var kept=hasAny(S.gu);
 incoming={raw:raw,state:dec.state,revealed:!!(saved&&saved.revealed),guess:(saved&&saved.revealed)?cloneState(saved.guess||{}):(kept?cloneState(S.gu):null),started:!!(saved&&(saved.started||saved.revealed))||kept};
 if(kept&&!incoming.revealed)saveIncoming();
 showGate=!incoming.revealed&&!incoming.started;
 if(incoming.revealed)tab='cm';else if(incoming.started)tab='gu'}
function dismissShare(){incoming=null;showGate=false;shownLink='';
 try{sessionStorage.removeItem(SSKEY)}catch(e){}
 if(location.hash)history.replaceState(null,'',location.pathname+location.search);
 tab='me';render()}
function beginImagine(){if(incoming){incoming.started=true;saveIncoming()}showGate=false;tab='gu';render()}
function reveal(){if(!incoming||!incoming.state||incoming.revealed)return;
 incoming.revealed=true;incoming.started=true;incoming.guess=cloneState(S.gu);saveIncoming();saveLocal();showGate=false;tab='cm';render()}
function go(k){if(showGate&&incoming&&incoming.state){incoming.started=true;saveIncoming()}showGate=false;tab=k;render()}
function shareText(url){return 'Te comparto cómo estoy. Antes de abrir el enlace, imagina mi estado.\n'+url}
function whatsAppHref(url){return 'https://wa.me/?text='+encodeURIComponent(shareText(url))}

function val(st,d){var keys=selectedKeys(d,st);if(!keys.length)return null;return d.multi?keys.map(function(x){return lab(d,x)}).join(', '):lab(d,keys[0])}

  r.appendChild(el('td',both?(m?'ok':'no'):'',both?(m?'coincide':'distinto'):''));t.appendChild(r)});
 w.appendChild(t);return {node:w,hit:hit,tot:tot}}
